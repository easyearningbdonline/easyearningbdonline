<!DOCTYPE html>
<html lang="bn">
<head>

  <script>(function(s){s.dataset.zone='12111532',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: #ffffff;
    }

    .ad-container {
      margin: 15px 0;
      text-align: center;
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    .card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .terms-box {
      background: rgba(56, 189, 248, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .terms-box h4 {
      color: #38bdf8;
      font-size: 14px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .math-box {
      background: #0f172a;
      border: 1.5px solid #a855f7;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }

    .level-indicator {
      font-size: 13px;
      color: #a855f7;
      font-weight: 600;
      margin-bottom: 6px;
      text-align: right;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .input-field {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      color: #ffffff;
      font-size: 16px;
      outline: none;
      text-align: center;
    }

    .input-field:focus {
      border-color: #a855f7;
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.3);
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 16px rgba(168, 85, 247, 0.4);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .error-msg {
      color: #f43f5e;
      font-size: 13px;
      text-align: center;
      margin-top: 8px;
      display: none;
    }

    /* Video Ad Overlay Styles */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.98);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
    }

    /* Video Player Box Mockup */
    .video-player-box {
      width: 100%;
      height: 200px;
      background: #000000;
      border-radius: 12px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin: 15px 0;
      border: 1px solid #334155;
    }

    .video-player-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .gift-icon {
      font-size: 50px;
      color: #f59e0b;
      margin-bottom: 10px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .collect-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 22px;
      color: #ffffff;
      cursor: pointer;
      display: none;
      background: #f43f5e;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      z-index: 10;
    }

    .close-btn:hover {
      background: #e11d48;
    }

    .timer-text {
      font-size: 15px;
      color: #38bdf8;
      font-weight: 600;
      background: #0f172a;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px dashed #a855f7;
      display: inline-block;
    }

    .status-msg {
      font-size: 16px;
      color: #10b981;
      font-weight: 700;
      display: none;
      margin-top: 15px;
      background: #0f172a;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #10b981;
    }
  </style>
</head>
<body>

  <!-- Entry Video Ad Overlay (সাইটে প্রবেশের সময় ভিডিও অ্যাড ও টাইমার) -->
  <div class="overlay" id="entryAdOverlay">
    <div class="modal-card">
      <button class="close-btn" id="entryCloseBtn">&times;</button>
      <h3 style="color: #ffffff; margin-bottom: 5px; font-size: 18px;"><i class="fa-solid fa-play-circle" style="color: #38bdf8;"></i> ভিডিও বিজ্ঞাপন</h3>
      <p style="color: #94a3b8; font-size: 12px; margin-bottom: 5px;">সাইটে প্রবেশ করতে ভিডিওটি দেখুন</p>
      
      <!-- Video Player Ad Container -->
      <div class="video-player-box">
        <script async="async" data-cfasync="false" src="https://bicea.org/21/6491e570ce0aa42716c848069f9c0961"></script>
        <div id="container-6491e570ce0aa42716c848069f9c0961" style="width:100%; height:100%;"></div>
      </div>

      <!-- Timer Box -->
      <div class="timer-text" id="entryTimerBox">
        অপেক্ষা করুন: <b id="entryCountdown" style="color: #f43f5e; font-size: 16px;">25</b> সেকেন্ড
      </div>
    </div>
  </div>

  <!-- Reward Video Ad Overlay (রিওয়ার্ড পাওয়ার ভিডিও অ্যাড) -->
  <div class="overlay" id="rewardAdOverlay" style="display: none;">
    <div class="modal-card">
      <button class="close-btn" id="rewardCloseBtn">&times;</button>
      
      <div id="rewardStep1">
        <i class="fa-solid fa-gift gift-icon"></i>
        <h3 style="color: #ffffff; margin-bottom: 6px;">অভিনন্দন!</h3>
        <p style="color: #94a3b8; font-size: 13px;">আপনি ৩টি অংকের সঠিক সমাধান করেছেন।</p>
        <button class="collect-btn" id="collectRewardBtn">
          <i class="fa-solid fa-hand-holding-dollar"></i> Collect Reward
        </button>
      </div>

      <div id="rewardStep2" style="display: none;">
        <h3 style="color: #ffffff; margin-bottom: 5px; font-size: 18px;"><i class="fa-solid fa-video" style="color: #a855f7;"></i> রিওয়ার্ড ভিডিও চলছে...</h3>
        
        <!-- Video Player Box -->
        <div class="video-player-box">
          <script async="async" data-cfasync="false" src="https://bicea.org/21/6491e570ce0aa42716c848069f9c0961"></script>
          <div id="container-6491e570ce0aa42716c848069f9c0961-2" style="width:100%; height:100%;"></div>
        </div>

        <div class="timer-text" id="rewardTimerBox">
          অপেক্ষা করুন: <b id="rewardCountdown" style="color: #f43f5e; font-size: 16px;">25</b> সেকেন্ড
        </div>
      </div>

      <div class="status-msg" id="pendingMsg">
        <i class="fa-solid fa-clock-rotate-left"></i> Your reward is pending
      </div>
    </div>
  </div>

  <!-- Top Banner Ad -->
  <div class="ad-container">
    <script>
      atOptions = {
        'key' : '442880b68a76f949f136f925027be8d1',
        'format' : 'iframe',
        'height' : 90,
        'width' : 728,
        'params' : {}
      };
    </script>
    <script src="https://bicea.org/22/442880b68a76f949f136f925027be8d1"></script>
  </div>

  <!-- Main Card -->
  <div class="card">
    <div class="terms-box" id="termsContainer" style="display: none;">
      <h4><i class="fa-solid fa-circle-info"></i> শর্তাবলী (Terms & Conditions)</h4>
      <p id="termsText"></p>
    </div>

    <div class="section-title">
      <i class="fa-solid fa-calculator"></i> অংক করুন
    </div>

    <div class="level-indicator">অংক নম্বর: <span id="currentLevel">1</span>/3</div>

    <div class="math-box" id="mathProblem"></div>

    <form id="mathForm">
      <div class="form-group">
        <input type="number" id="userAnswer" class="input-field" placeholder="উত্তর লিখুন..." required autocomplete="off">
      </div>
      <button type="submit" class="submit-btn">
        <span>সাবমিট করুন</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
      <div class="error-msg" id="errorMsg"><i class="fa-solid fa-circle-xmark"></i> ভুল উত্তর! সঠিক উত্তর চেষ্টা করুন।</div>
    </form>
  </div>

  <!-- Bottom Native Ad Container -->
  <div class="ad-container">
    <script async="async" data-cfasync="false" src="https://bicea.org/21/6491e570ce0aa42716c848069f9c0961"></script>
    <div id="container-6491e570ce0aa42716c848069f9c0961-3"></div>
  </div>

  <!-- Firebase SDK Modular -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBDWy86UtMNL4sHyODBEQBbUxPKaj55LVk",
      authDomain: "earning-bd-2960a.firebaseapp.com",
      databaseURL: "https://earning-bd-2960a-default-rtdb.firebaseio.com",
      projectId: "earning-bd-2960a",
      storageBucket: "earning-bd-2960a.firebasestorage.app",
      messagingSenderId: "748680584232",
      appId: "1:748680584232:web:951dd7531c510d2d91691d"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    onValue(ref(database, 'settings/termsAndConditions'), (snapshot) => {
      if (snapshot.exists()) {
        const terms = snapshot.val();
        if (terms && terms.trim() !== "") {
          document.getElementById('termsText').innerText = terms;
          document.getElementById('termsContainer').style.display = "block";
        }
      }
    });
  </script>

  <script>
    const SMARTLINK_URL = "https://asiafilm.org/4/4fdcef539a5e40868425402583241d9b";

    // 1. ENTRY AD LOGIC WITH VIDEO PLAYER MOCKUP
    let entryTime = 25;
    const entryCountdownEl = document.getElementById('entryCountdown');
    const entryCloseBtn = document.getElementById('entryCloseBtn');
    const entryAdOverlay = document.getElementById('entryAdOverlay');
    const entryTimerBox = document.getElementById('entryTimerBox');

    const entryInterval = setInterval(() => {
      entryTime--;
      entryCountdownEl.innerText = entryTime;
      if (entryTime <= 0) {
        clearInterval(entryInterval);
        entryTimerBox.style.display = 'none';
        entryCloseBtn.style.display = 'flex';
      }
    }, 1000);

    entryCloseBtn.addEventListener('click', () => {
      entryAdOverlay.style.display = 'none';
    });

    // 2. MATH LOGIC
    let currentStep = 1;
    let correctAnswer = 0;

    function generateMath() {
      const isAddition = Math.random() > 0.5;
      let num1, num2;

      if (isAddition) {
        num1 = Math.floor(Math.random() * 20) + 1;
        num2 = Math.floor(Math.random() * 20) + 1;
        correctAnswer = num1 + num2;
        document.getElementById('mathProblem').innerText = `${num1} + ${num2} = ?`;
      } else {
        num1 = Math.floor(Math.random() * 20) + 5;
        num2 = Math.floor(Math.random() * num1) + 1;
        correctAnswer = num1 - num2;
        document.getElementById('mathProblem').innerText = `${num1} - ${num2} = ?`;
      }
    }

    generateMath();

    document.getElementById('mathForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const userAns = parseInt(document.getElementById('userAnswer').value);
      const errorMsg = document.getElementById('errorMsg');

      if (userAns === correctAnswer) {
        errorMsg.style.display = 'none';
        document.getElementById('userAnswer').value = '';

        if (currentStep < 3) {
          currentStep++;
          document.getElementById('currentLevel').innerText = currentStep;
          generateMath();
        } else {
          showRewardModal();
        }
      } else {
        errorMsg.style.display = 'block';
      }
    });

    // 3. REWARD AD LOGIC
    const rewardAdOverlay = document.getElementById('rewardAdOverlay');
    const collectRewardBtn = document.getElementById('collectRewardBtn');
    const rewardStep1 = document.getElementById('rewardStep1');
    const rewardStep2 = document.getElementById('rewardStep2');
    const rewardCloseBtn = document.getElementById('rewardCloseBtn');
    const rewardTimerBox = document.getElementById('rewardTimerBox');
    const pendingMsg = document.getElementById('pendingMsg');

    function showRewardModal() {
      rewardAdOverlay.style.display = 'flex';
    }

    collectRewardBtn.addEventListener('click', () => {
      window.open(SMARTLINK_URL, '_blank');

      rewardStep1.style.display = 'none';
      rewardStep2.style.display = 'block';

      let rewardTime = 25;
      const rewardCountdownEl = document.getElementById('rewardCountdown');

      const rewardInterval = setInterval(() => {
        rewardTime--;
        rewardCountdownEl.innerText = rewardTime;
        if (rewardTime <= 0) {
          clearInterval(rewardInterval);
          rewardTimerBox.style.display = 'none';
          rewardCloseBtn.style.display = 'flex';
        }
      }, 1000);
    });

    rewardCloseBtn.addEventListener('click', () => {
      rewardStep2.style.display = 'none';
      rewardCloseBtn.style.display = 'none';
      pendingMsg.style.display = 'block';

      setTimeout(() => {
        rewardAdOverlay.style.display = 'none';
        currentStep = 1;
        document.getElementById('currentLevel').innerText = currentStep;
        rewardStep1.style.display = 'block';
        pendingMsg.style.display = 'none';
        rewardTimerBox.style.display = 'block';
        generateMath();
      }, 2500);
    });
  </script>

</body>
</html>
